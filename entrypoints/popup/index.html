<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab Tools</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <ul id="actions">
      <li class="status" data-status="discard">
        <span class="label">Tabs</span>
        <span class="count" data-count="discard-status"></span>
      </li>
      <li>
        <button data-action="open-sidepanel">
          <span class="label">Show vertical tabs</span>
        </button>
      </li>
      <li>
        <button data-action="triage-tabs">
          <span class="label">Triage tabs by topic</span>
        </button>
      </li>
      <li>
        <button data-action="close-duplicate-tabs">
          <span class="label">Close duplicate tabs</span>
          <span class="count" data-count="duplicates"></span>
        </button>
      </li>
      <li>
        <button data-action="merge-all-windows">
          <span class="label">Merge all windows</span>
          <span class="count" data-count="windows"></span>
        </button>
      </li>
      <li>
        <button data-action="group-tabs-by-domain">
          <span class="label">Group tabs by domain</span>
        </button>
      </li>
      <li>
        <button data-action="close-stale-github-tabs">
          <span class="label">Close stale GitHub tabs</span>
        </button>
      </li>
      <li>
        <button data-action="sort-tabs-by-url">
          <span class="label">Sort tabs by URL</span>
        </button>
      </li>
      <li>
        <button data-action="sort-tabs-by-title">
          <span class="label">Sort tabs by title</span>
        </button>
      </li>
      <li>
        <button data-action="new-window-with-current-and-tabs-to-right">
          <span class="label">New window with current + tabs to right</span>
        </button>
      </li>
      <li>
        <button data-action="new-window-with-tabs-to-right">
          <span class="label">New window with tabs to right</span>
        </button>
      </li>
      <li>
        <button data-action="copy-tabs">
          <span class="label">Copy tab URLs</span>
          <kbd>⇧⌘C</kbd>
        </button>
      </li>
      <li>
        <button data-action="paste-tabs">
          <span class="label">Paste tab URLs</span>
          <kbd>⇧⌘V</kbd>
        </button>
      </li>
      <li>
        <button data-action="open-options">
          <span class="label">Options</span>
        </button>
      </li>
    </ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
